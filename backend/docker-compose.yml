# =============================================================================
# ilovepauldomar POS — PocketBase Backend
# Target: Synology DS220+ (10GB RAM, Btrfs) via Container Manager
# =============================================================================
# Notas de operação:
#   - Esta stack expõe o PocketBase APENAS em 127.0.0.1:${PB_HOST_PORT}.
#   - Acesso externo deve ser feito via DSM Reverse Proxy (Control Panel →
#     Login Portal → Advanced → Reverse Proxy), com Let's Encrypt do DSM.
#   - O diretório ./pb_data contém a BD SQLite (WAL ativo por defeito).
#     NUNCA copiar este diretório com o container a correr — usar a API de
#     backup do PocketBase (scripts/backup.sh na Fase 2).
# =============================================================================

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.34.2
    # ↑ Pinned version para builds reproducíveis. Atualizar conscientemente,
    #   nunca com :latest em produção. Série 0.34 traz a sintaxe JSVM moderna
    #   (onRecordCreate, onRecordCreateRequest, e.next(), $app sem dao()).

    container_name: ilovepauldomar-pb
    restart: unless-stopped

    # --- Rede ---
    # Bind apenas ao loopback do NAS. O DSM Reverse Proxy trata do HTTPS.
    # A porta do host é parametrizada por ambiente via PB_HOST_PORT no .env:
    #   - Local (Mac):    PB_HOST_PORT=8090
    #   - NAS (DS220+):   PB_HOST_PORT=8095  (8090 ocupada por outro projeto)
    # A porta interna do container é sempre 8090 (default do PocketBase).
    ports:
      - "127.0.0.1:${PB_HOST_PORT:-8090}:8090"

    # --- Persistência (bind mounts → visíveis ao Hyper Backup) ---
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
      - ./pb_public:/pb_public

    # --- Configuração via env ---
    # A imagem muchobien lê ENCRYPTION e passa-a ao binário com --encryptionEnv.
    environment:
      - TZ=${TZ:-Europe/Lisbon}
      # ENCRYPTION: chave (hex 32 bytes) para encriptar settings sensíveis
      # no SQLite (SMTP password, OAuth secrets, S3 keys, etc).
      # Gerar com: openssl rand -hex 32
      - ENCRYPTION=${PB_ENCRYPTION_KEY}

    # --- Healthcheck ---
    # wget vem do busybox em todas as imagens alpine recentes.
    # O healthcheck corre DENTRO do container, por isso usa sempre 8090.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # --- Limites de recursos (proteção do NAS) ---
    # mem_limit e mem_reservation: protegem o NAS de OOM se o PocketBase
    #   tiver fuga de memória. Valores conservadores — PB típico usa 30-80MB.
    mem_limit: 512m
    mem_reservation: 128m
    # cpus: DESATIVADO no DS220+ por incompatibilidade com o kernel do DSM 7.x
    #   (ARM Realtek RTD1296 sem CPU CFS scheduler).
    #   Erro observado:
    #     "NanoCPUs can not be set, as your kernel does not support CPU CFS
    #      scheduler or the cgroup is not mounted"
    #   Limite de RAM acima já dá proteção suficiente.
    # cpus: 1.0

    # --- Logging com rotação (evita encher o disco do DSM) ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # --- Hardening básico ---
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Não declaramos `networks:` — usar a default bridge é suficiente para
# um único container e mais leve que criar rede dedicada.
# =============================================================================
